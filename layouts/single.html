{{ define "main" }}<article class="single-page container"><a class="back-link" href="{{ .Parent.RelPermalink }}">← Back to {{ .Parent.Title }}</a><p class="eyebrow">{{ .Section }}</p><h1>{{ .Title }}</h1><div class="single-meta">{{ with .Params.status }}<span class="status status-{{ lower . }}">{{ . }}</span>{{ end }}{{ with .Date }}<time>{{ .Format "January 2006" }}</time>{{ end }}</div><div class="prose">{{ .Content }}</div>{{ with .Params.tech }}<h2>Technology</h2><div class="tag-list">{{ range . }}<span>{{ . }}</span>{{ end }}</div>{{ end }}</article>{{ end }}
