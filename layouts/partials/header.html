<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Home">
      <span class="brand-mark">EH</span>
      <span>{{ site.Params.author }}</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation">
      {{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
      <a class="nav-contact" href="mailto:{{ site.Params.email }}">Contact</a>
      <button class="theme-toggle" type="button" aria-label="Toggle color theme"><span aria-hidden="true">◐</span></button>
    </nav>
  </div>
</header>
